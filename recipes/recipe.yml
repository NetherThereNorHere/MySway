---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: mysway
description: Minimal Sway build that suits my needs.

base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - blakegardner/xremap
        - erikreider/swayosd
        - erovia/dfu-programmer
    install:
      packages:
        # --- SYSTEM FOUNDATION ---
        - libva-utils
        - mesa-dri-drivers
        - mesa-vulkan-drivers
        - vulkan-loader
        - mesa-va-drivers
        
        - NetworkManager
        - pipewire
        - policycoreutils
        - pipewire-pulseaudio
        - selinux-policy-targeted
        - wireplumber
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-wlr
        - xorg-x11-server-Xwayland
        # --- DESKTOP & UI ---
        - sddm
        - sddm-wayland-sway
        - sway
        - foot
        - fuzzel
        - swaybg
        - swayidle
        - swaylock
        - mako
        - swayosd
        - jetbrains-mono-fonts-all
        # --- SHELL & UTILS ---
        - zsh
        - stow
        - eza
        - zoxide
        - fzf
        - bat
        - ripgrep
        - fd-find
        - jq
        - htop
        # --- GRAPHICS & MEDIA ---
        - mpv
        - swayimg
        # --- HARDWARE & DEV ---
        - distrobox
        - openrgb-udev-rules
        - steam-devices
        - i2c-tools
        - solaar
        - xremap
        - dfu-util
        - dfu-programmer
        # --- MISC UTILS ---
        - aria2
        - bc
        - dash
        - file
        - gdisk
        - inxi
        - mupdf
        - nmap
        - progress
        - tldr
        - trash-cli
        - unar
        - unzip
        - usbutils
        - wev
        - wl-clipboard
        - wordgrinder
    remove:
      packages:
        - firefox

  - type: default-flatpaks
    configurations:
      - scope: system
        repo:
          name: flathub
          title: Flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
        install:
          - com.github.Matoking.protontricks
          - com.github.tchx84.Flatseal
          - io.github.wivrn.wivrn
          - io.gitlab.librewolf-community
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton-GE
      
      - scope: user
        repo:
          name: flathub
          title: Flathub
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          
      - scope: system
        repo:
          name: flathub-beta
          title: Flathub Beta
          url: https://flathub.org/beta-repo/flathub-beta.flatpakrepo
        install:
          - org.openrgb.OpenRGB

  - type: script
    snippets:
      - "systemctl enable sddm.service"
      - "systemctl enable NetworkManager.service"
      - "systemctl set-default graphical.target"
      - "systemctl enable swayosd-libinput-backend.service"
      - "systemctl --global enable pipewire.socket"
      - "systemctl --global enable wireplumber.service"
 
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
