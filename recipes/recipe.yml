---

name: mysway
description: Minimal Sway build that suits my needs.

base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: kargs
    arch: x86_64
    kargs:
      - loglevel=3
      - amdgpu.modeset=1
      - amdgpu.sg_display=0      # Disables Scatter/Gather which causes TTY flickers
      - amdgpu.dcdebugmask=0x410 # Disables both PSR and Panel Replay
      - video=DP-1:3440x1440@174.002
      
  - type: dnf
    install:
      packages:
        # --- GRAPHICS ---
        - libva-utils
        - mesa-dri-drivers
        - mesa-va-drivers
        - mesa-vulkan-drivers
        - vulkan-loader
        # --- SOUND ---
        - pipewire
        - pipewire-pulseaudio
        - wireplumber
        # --- HARDWARE ---
        - i2c-tools
        - NetworkManager
        - openrgb
        - openrgb-udev-rules
        - solaar
        - steam-devices
        # --- SECURITY ---
        - policycoreutils
        - selinux-policy-targeted
        # --- FLATPAK ---
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-wlr
        # --- DISPLAY MANAGER ---
        # - sddm
        # - sddm-wayland-sway
        # --- WINDOW MANAGER ---
        - sway
        - brightnessctl
        - fuzzel
        - jq
        - mako
        - py3status
        - swaybg
        - swayidle
        - swaylock
        - wlsunset
        - wl-clipboard
        - xorg-x11-server-Xwayland
        # --- TERMINAL ---
        - foot
        - bashmount
        - bat
        - dash
        - eza
        - fastfetch
        - fd-find
        - file
        - fzf
        - inxi
        - progress
        - ripgrep
        - tldr
        - trash-cli
        - zoxide
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting
        - util-linux-user # Needed to change the shell to zsh
        # --- FONTS & THEMES ---
        - jetbrains-mono-fonts-all
        # --- UTILS ---
        - aria2
        - bc
        - distrobox
        - gdisk
        - htop
        - mpv
        - mupdf
        - nmap
        - swayimg
        - unar
        - unzip
        - usbutils
        - wev
        - wordgrinder 
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - com.github.Matoking.protontricks
          - com.github.tchx84.Flatseal
          - io.github.wivrn.wivrn
          - io.gitlab.librewolf-community
          - com.valvesoftware.Steam
          - com.valvesoftware.Steam.CompatibilityTool.Proton-GE
      - scope: user

  - type: script
    snippets:
      # Set zsh as default shell
      - sed -i 's/SHELL=\/bin\/bash/SHELL=\/usr\/bin\/zsh/' /etc/default/useradd
      - grep -q '/usr/bin/zsh' /etc/shells || echo '/usr/bin/zsh' >> /etc/shells

      # Append a loader to the end of the system-wide zshrc 
      - "echo 'for i in /etc/zsh/zshrc.d/*.zsh; do source \"$i\"; done' >> /etc/zshrc"

      # Force AMD driver into initramfs for Early KMS
      - echo 'add_drivers+=" amdgpu "' > /etc/dracut.conf.d/early-kms.conf

      #- "echo 'high' > /sys/class/drm/card0/device/power_dpm_force_performance_level"

      #- "systemctl enable sddm.service"
      #- "systemctl set-default graphical.target" # Needed for graphical displaymanagers
      - "systemctl set-default multi-user.target" # Needed for TTY autologin
      - "systemctl enable NetworkManager.service"
      - "systemctl --global enable pipewire.socket"
      - "systemctl --global enable wireplumber.service"
 
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
