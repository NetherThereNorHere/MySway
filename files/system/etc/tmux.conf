# --- BASIC SETUP ---
set-option -g default-shell /usr/bin/zsh
set -g mouse on
setw -g mode-keys vi
set -s escape-time 0  # Makes Escape instant
set -g update-environment "WAYLAND_DISPLAY"
set -g allow-passthrough on

# --- FALLBACK COLORS ---
set -g status-left "#[fg=white,bg=black,bold] INSERT "

# --- MODAL KEYBINDINGS ---
# Press Alt+i to enter "Normal Mode"
unbind-key -n Escape
bind-key -n M-i copy-mode

# Inside "Normal Mode" (copy-mode-vi)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi i send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# --- VISUAL INDICATOR ---
set -g status-left-length 40
set -g status-left " "
set -g status-style bg=default,fg=white
set -g status-right "#[fg=cyan]%H:%M "

# Jump into Normal Mode and scroll up one page with one key
bind-key -n PPage copy-mode -u
