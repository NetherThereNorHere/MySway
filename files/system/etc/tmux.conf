# --- BASIC SETUP ---
set-option -g default-shell /usr/bin/zsh
set -g mouse on
setw -g mode-keys vi
set -s escape-time 0  # Makes Escape instant

# --- MODAL KEYBINDINGS ---
# Press Escape to enter "Normal Mode"
bind-key -n M-Escape copy-mode

# Inside "Normal Mode" (copy-mode-vi)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi i send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# --- VISUAL INDICATOR ---
# Changes the status bar text to show if you are in [NORMAL] or [INSERT]
set -g status-left-length 20
set -g status-left "#{?pane_in_mode,#[fg=THEME_FG,bg=$THEME_NORMAL,bold] NORMAL ,#[fg=THEME_FG,bg=$THEME_INSERT,bold] INSERT } "

# Some clean styling for the rest of the bar
set -g status-style bg=default,fg=white
set -g status-right "#[fg=cyan]%H:%M "

# Jump into Normal Mode and scroll up one page with one key
bind-key -n PPage copy-mode -u
